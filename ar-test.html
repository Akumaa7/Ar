<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste ARCore</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#101712;color:#fff}
model-viewer{width:100%;height:55vh;background:#1b261f}
.box{padding:14px;font-size:14px;line-height:1.5}
.ok{color:#c9f36b}.no{color:#ff9d8a}
button{width:100%;padding:16px;border:0;border-radius:14px;background:#c9f36b;color:#18211d;font-weight:700;font-size:16px;margin-top:10px}
pre{white-space:pre-wrap;font-size:12px;color:#9f9}
</style></head><body>
<model-viewer id="mv" src="assets/house-burger.glb" camera-controls auto-rotate shadow-intensity="1"
  ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor" camera-orbit="25deg 72deg 0.3m"></model-viewer>
<div class="box">
  <div id="res">Verificando…</div>
  <button id="go" disabled>Ver na minha mesa (AR)</button>
  <pre id="log"></pre>
</div>
<script>
const mv=document.getElementById('mv'),res=document.getElementById('res'),go=document.getElementById('go'),log=document.getElementById('log');
const L=t=>log.textContent+=t+'\n';
L('HTTPS: '+window.isSecureContext);
L('Navegador: '+navigator.userAgent);
(async()=>{
  try{ if(navigator.xr){ L('WebXR immersive-ar: '+await navigator.xr.isSessionSupported('immersive-ar')); } else L('WebXR: não existe neste navegador (use o Chrome)'); }catch(e){L('WebXR erro: '+e.message)}
})();
mv.addEventListener('load',()=>{
  L('modelo carregado');
  setTimeout(()=>{
    if(mv.canActivateAR){res.innerHTML='<b class="ok">✅ AR nativo disponível!</b> Toque no botão.';go.disabled=false;}
    else{res.innerHTML='<b class="no">❌ AR nativo indisponível.</b> Instale/atualize “Google Play Services for AR”, abra no Chrome e tente de novo.';}
  },500);
});
mv.addEventListener('error',e=>L('erro modelo: '+JSON.stringify(e.detail)));
mv.addEventListener('ar-status',e=>L('ar-status: '+e.detail.status));
mv.addEventListener('ar-tracking',e=>L('ar-tracking: '+e.detail.status));
go.onclick=()=>mv.activateAR();
</script></body></html>
